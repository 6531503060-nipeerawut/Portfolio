<!--
  Tab icon: the brand mark on the signature gradient tile.

  The gradient is the light-theme ramp rather than a theme-aware one — a tab
  strip can be light or dark and the file cannot know which, and these are the
  saturated values that hold up against both.

  The glyph is the path from logo.svg, scaled to 82% about the centre so it
  keeps an icon-sized margin inside the tile. stroke-width is pre-divided by
  that scale so the line still renders at 3.4 units.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brand" x1=".02" y1=".22" x2=".98" y2=".78">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset=".48" stop-color="#a855f7" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#brand)" />

  <g transform="translate(16 16) scale(.82) translate(-16 -16)" fill="none" stroke="#fff"
    stroke-width="3.9" stroke-linecap="round">
    <path d="M5.9 26.3C5.9 21.2 8.4 15.6 11.8 13.97A5.2 5.2 0 1 1 20.2 13.97C23.6 15.6 26.1 21.2 26.1 26.3" />
  </g>
</svg>
