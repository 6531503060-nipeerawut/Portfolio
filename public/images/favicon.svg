<!--
  Tab icon: the brand mark on the signature gradient tile.

  The gradient is the light-theme ramp rather than a theme-aware one — a tab
  strip can be light or dark and the file cannot know which, and these are the
  saturated values that hold up against both.

  The mark is the pair of paths from logo.svg, unchanged. The shoulders run
  past y=32 by design, so they are clipped to the tile's own rounded corners
  rather than being redrawn to fit; the lens holes come from the even-odd
  rule and let the gradient underneath show through.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="brand" x1=".02" y1=".22" x2=".98" y2=".78">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset=".48" stop-color="#a855f7" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <clipPath id="tile">
      <rect width="32" height="32" rx="9" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="url(#brand)" />
    <g fill="#fff" fill-rule="evenodd">
      <path d="M16 5.6a5.9 5.9 0 1 1 0 11.8 5.9 5.9 0 0 1 0-11.8Zm-2.65 3.9a2.05 2.05 0 1 0 0 4.1 2.05 2.05 0 0 0 0-4.1Zm5.3 0a2.05 2.05 0 1 0 0 4.1 2.05 2.05 0 0 0 0-4.1Zm-3.25 1.65h1.2v.8h-1.2Z" />
      <path d="M4.2 32c0-7.3 5.2-12.4 11.8-12.4S27.8 24.7 27.8 32Z" />
    </g>
  </g>
</svg>
