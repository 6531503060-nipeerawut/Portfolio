<!--
  Brand mark — a person drawn as one unbroken line, from the first stroke to
  the last. Geometry: the glyph is exactly 24x24 centred in a 32x32 box, so it
  keeps a 4-unit margin on every side at any size.

  The same path is inlined in app/_components/site-header.tsx and baked into
  favicon.svg; change one, change all three.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none"
  stroke="currentColor" stroke-width="3.2" stroke-linecap="round" role="img"
  aria-label="Peerawut Nipakornpan">
  <path d="M5.9 26.3C5.9 21.2 8.4 15.6 11.8 13.97A5.2 5.2 0 1 1 20.2 13.97C23.6 15.6 26.1 21.2 26.1 26.3" />
</svg>
